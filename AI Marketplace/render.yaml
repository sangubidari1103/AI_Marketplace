services:
  - type: web
    name: ai-marketplace-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NEMOTRON_MODEL
        sync: false
      - key: FRONTEND_URL
        value: https://ai-marketplace-frontend-x5ew.onrender.com

  - type: web
    name: ai-marketplace-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-marketplace-backend-znzm.onrender.com/api
      - key: VITE_SUPABASE_URL
        value: https://ysqbbpeisgzijcrtefqn.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false